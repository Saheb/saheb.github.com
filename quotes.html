<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes I love</title>
    <link rel="icon" type="image/png" href="/saheb-circle.png">
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>

<body>
    <main class="container quotes-page">
        <h2>Quotes I love</h2>
        <figure class="quote">
            <blockquote><p>We are all in the gutter, but some of us are looking at the stars.</p></blockquote>
            <figcaption>Oscar Wilde</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>The freedom to make my own mistakes is all I ever wanted.</p></blockquote>
            <figcaption>Mance Rayder</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>I could die for you. But I couldn&#x27;t, and wouldn&#x27;t, live for you.</p></blockquote>
            <figcaption>Ayn Rand</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>Failure is irrelevant unless it is catastrophic.</p></blockquote>
            <figcaption>Elon Musk</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>If you kill a cockroach, you are a hero; if you kill a butterfly, you are evil; morality has aesthetic standards.</p></blockquote>
            <figcaption>Nietzsche</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>You have to die a few times before you can really live.</p></blockquote>
            <figcaption>Bukowski</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>Life is a tragedy in close-up, but a comedy in long-shot.</p></blockquote>
            <figcaption>Charlie Chaplin</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>The only Zen you find on the tops of mountains is the Zen you bring there.</p></blockquote>
            <figcaption>Robert M. Pirsig</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>Beautiful things don&#x27;t ask for attention</p></blockquote>
            <figcaption>Sean O&#x27;Connell, The Secret Life of Walter Mitty.</figcaption>
        </figure>
        <figure class="quote">
            <blockquote><p>All that is gold does not glitter,<br>Not all those who wander are lost;</p></blockquote>
            <figcaption>Tolkien</figcaption>
        </figure>
    </main>
</body>

</html>
