<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project viewer</title>
    <link rel="icon" type="image/png" href="/saheb-circle.png">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            color: #222;
            background: #f5f5f5;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .viewer-bar {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            min-height: 58px;
            padding: 10px 18px;
            border-bottom: 1px solid #ddd;
            background: #fff;
            flex-shrink: 0;
        }

        .viewer-bar a {
            color: #0069d9;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .viewer-bar a:hover {
            text-decoration: underline;
        }

        .viewer-back {
            justify-self: start;
        }

        .viewer-title {
            margin: 0;
            overflow: hidden;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .viewer-external {
            justify-self: end;
        }

        #project-frame {
            flex: 1;
            min-height: 0;
            width: 100%;
            border: 0;
            background: #fff;
        }

        .viewer-error {
            display: none;
            max-width: 540px;
            margin: 80px auto;
            padding: 24px;
            text-align: center;
        }

        @media (max-width: 560px) {
            .viewer-bar {
                grid-template-columns: 1fr auto;
                gap: 8px;
                min-height: 54px;
                padding: 9px 12px;
            }

            .viewer-title {
                display: none;
            }

            .viewer-bar a {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <header class="viewer-bar">
        <a class="viewer-back" href="/projects.html">← Back to projects</a>
        <h1 class="viewer-title" id="viewer-title">Project</h1>
        <a class="viewer-external" id="viewer-external" href="#" target="_blank"
            rel="noopener noreferrer">Open separately ↗</a>
    </header>
    <iframe id="project-frame" title="Interactive project" allow="fullscreen"></iframe>
    <div class="viewer-error" id="viewer-error">
        <h1>Project not found</h1>
        <p><a href="/projects.html">Return to projects</a></p>
    </div>

    <script>
        const projects = {
            "orbit-wars": {
                title: "Orbit Wars replay",
                url: "https://saheb.github.io/blog/orbit-wars/replay-83428941.html"
            },
            "rl-snake": {
                title: "RL Snake",
                url: "https://saheb.github.io/rl-snake/"
            },
            "tastebento": {
                title: "TasteBento",
                url: "https://tastebento.com",
                embedUrl: "https://tastebento.com/login"
            }
        };

        const key = new URLSearchParams(window.location.search).get("project");
        const project = projects[key];
        const frame = document.getElementById("project-frame");
        const error = document.getElementById("viewer-error");

        if (project) {
            document.title = `${project.title} — Saheb's projects`;
            document.getElementById("viewer-title").textContent = project.title;
            document.getElementById("viewer-external").href = project.url;
            frame.title = project.title;
            frame.src = project.embedUrl || project.url;
        } else {
            document.querySelector(".viewer-bar").style.display = "none";
            frame.style.display = "none";
            error.style.display = "block";
        }
    </script>
</body>

</html>
