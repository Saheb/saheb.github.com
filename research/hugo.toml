baseURL = 'https://saheb.github.io/research/'
languageCode = 'en-us'
title = 'Research'
theme = 'hugo-paper'
themesDir = '../blog/themes'
relativeURLs = true
canonifyURLs = true

[params]
  color = 'blue'
  monoDarkIcon = true
  mainSections = ['posts']
  showListTags = true

[markup.goldmark.renderer]
  unsafe = true

# Reuse the blog's custom templates and styles, including its automatic TOC.
[module]
  [[module.mounts]]
    source = '../blog/layouts'
    target = 'layouts'
  [[module.mounts]]
    source = '../blog/assets'
    target = 'assets'
