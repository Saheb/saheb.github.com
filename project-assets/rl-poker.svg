<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">RL Poker agent architecture</title>
  <desc id="desc">A heads-up poker table above a pipeline from a full CFR blueprint to real-time turn and river solving.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1423"/>
      <stop offset="1" stop-color="#142f30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <text x="54" y="70" fill="#fff" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Heads-up NLHE agent</text>
  <text x="54" y="104" fill="#a9bbc0" font-family="system-ui, sans-serif" font-size="19">Full CFR blueprint + real-time endgame solving</text>

  <ellipse cx="480" cy="264" rx="300" ry="122" fill="#176448" stroke="#5ea98a" stroke-width="5" filter="url(#shadow)"/>
  <ellipse cx="480" cy="264" rx="252" ry="91" fill="none" stroke="#b5dbc8" stroke-opacity=".22" stroke-width="3"/>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="284" y="199" width="65" height="92" rx="8" fill="#fff" transform="rotate(-7 316 245)"/>
    <text x="316" y="238" fill="#151515" font-size="29" font-weight="700" transform="rotate(-7 316 245)">A♠</text>
    <rect x="354" y="199" width="65" height="92" rx="8" fill="#fff" transform="rotate(5 386 245)"/>
    <text x="386" y="238" fill="#bd2c32" font-size="29" font-weight="700" transform="rotate(5 386 245)">K♥</text>

    <g font-size="23" font-weight="700">
      <rect x="442" y="228" width="48" height="68" rx="6" fill="#f8f8f8"/><text x="466" y="270" fill="#bd2c32">7♦</text>
      <rect x="496" y="228" width="48" height="68" rx="6" fill="#f8f8f8"/><text x="520" y="270" fill="#151515">J♣</text>
      <rect x="550" y="228" width="48" height="68" rx="6" fill="#f8f8f8"/><text x="574" y="270" fill="#bd2c32">10♥</text>
    </g>
    <text x="480" y="345" fill="#d6eee2" font-size="18" font-weight="600">Agent decision</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <g transform="translate(54 424)">
      <rect width="242" height="112" rx="13" fill="#fff" fill-opacity=".08" stroke="#6f8d96"/>
      <text x="20" y="37" fill="#93d6bc" font-size="16" font-weight="700">PREFLOP</text>
      <text x="20" y="70" fill="#fff" font-size="23" font-weight="650">Full CFR blueprint</text>
      <text x="20" y="94" fill="#afc0c4" font-size="15">5M-iteration strategy</text>
    </g>
    <text x="315" y="489" fill="#7fa093" font-size="34">→</text>
    <g transform="translate(350 424)">
      <rect width="242" height="112" rx="13" fill="#fff" fill-opacity=".08" stroke="#6f8d96"/>
      <text x="20" y="37" fill="#93d6bc" font-size="16" font-weight="700">TURN</text>
      <text x="20" y="70" fill="#fff" font-size="23" font-weight="650">Real-time MCCFR</text>
      <text x="20" y="94" fill="#afc0c4" font-size="15">Range-aware subgame solve</text>
    </g>
    <text x="611" y="489" fill="#7fa093" font-size="34">→</text>
    <g transform="translate(646 424)">
      <rect width="260" height="112" rx="13" fill="#fff" fill-opacity=".08" stroke="#6f8d96"/>
      <text x="20" y="37" fill="#93d6bc" font-size="16" font-weight="700">RIVER</text>
      <text x="20" y="70" fill="#fff" font-size="23" font-weight="650">Resolve &amp; act</text>
      <text x="20" y="94" fill="#afc0c4" font-size="15">Benchmarked vs Slumbot</text>
    </g>
  </g>
</svg>
